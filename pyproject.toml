[project]
name = "monitask-center"
version = "1.1.0"
description = "Workday Monitask timer checks driven by launchd"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wes Kao" }]
dependencies = ["telegram-kit>=0.2.0,<0.3"]

[project.scripts]
monitask-center = "monitask_center.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitask_center"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
