[project]
name = "monitask-center"
version = "1.9.5"
description = "Workday Monitask timer checks driven by launchd"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wes Kao" }]
dependencies = ["telegram-kit>=0.2.0,<0.3"]

[project.scripts]
monitask-center = "monitask_center.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitask_center"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17.1"]

[tool.ruff.lint]
# Pinned instead of ruff's moving default set, so a ruff upgrade cannot change
# lint on unchanged code. I/UP are whole groups (autofixable); B is cherry-picked.
select = ["E4", "E7", "E9", "F", "I", "UP", "B023", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
